# Vercel-compatible server port. Vercel injects PORT for container deployments.
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=rangeen-raat

# For production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD to a persistent external MySQL database.
# The H2 fallback is intended only for local/demo use because Vercel containers
# are ephemeral and local filesystem/database state is not durable.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:rangeenraat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

