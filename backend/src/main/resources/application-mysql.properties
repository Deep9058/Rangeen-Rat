spring.application.name=rangeen-raat

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rangeenraat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

razorpay.key.id=${RAZORPAY_KEY_ID}
